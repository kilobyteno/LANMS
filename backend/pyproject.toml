[project]
name = "lanms-backend"
version = "3.0.0a11"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic~=1.18.4",
    "fastapi[standard]~=0.136.3",
    "pydantic[email]~=2.13.4",
    "pydantic-extra-types~=2.11.1",
    "requests~=2.33.1",
    "psycopg2-binary~=2.9.12",
    "sentry-sdk[fastapi,sqlalchemy,starlette]~=2.61.1",
    "sqlalchemy~=2.0.50",
    "pyjwt[crypto]~=2.12.1",
    "pyotp~=2.9.0",
    "passlib~=1.7.4",
    "bcrypt>=4.0.1,<5",
    "pandas~=3.0.2",
    "fastapi-pagination~=0.15.14",
    "fastapi-filter[sqlalchemy]~=2.0.1",
    "sendgrid~=6.12.5",
    "python-dotenv~=1.2.2",
    "tunsberg~=0.3.0",
    "phonenumbers~=9.0.31",
    "postmarker~=1.0.0",
    "uuid6~=2025.0.1",
]

[dependency-groups]
dev = [
    "pre-commit~=4.6.0",
    "pytest>=9.0.3",
    "ruff~=0.15.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
filterwarnings = [
    # passlib imports stdlib ``crypt`` (deprecated in Python 3.13); fixed upstream when passlib releases.
    "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
]

[tool.ruff]
line-length = 160
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "alembic",
]

[tool.ruff.lint]
select = [
    "RUF", # ruff
    "E", "W", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "T", # flake8-print
    "TD", # flake8-todos
    "LOG", # flake8-logging
    "N", # pep8-naming
    "D", # pydocstyle
    "RET", # flake8-return
    "TYP", # flake8-type-checking
    "PL", # pylint
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D415", # First line should end with a period
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D400", # First line should end with a period
    "TD003", # Missing issue link on the line following
    "B008", # Do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D103", # test functions do not need docstrings
    "PLR2004", # HTTP status codes and similar are clear in context
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
